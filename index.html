<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AWS SAP 単語帳</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Zen+Kaku+Gothic+New:wght@400;500;700;900&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #0E2A43;
    --bg-panel: #12385A;
    --bg-panel-2: #0C2438;
    --grid-line: rgba(255,255,255,0.07);
    --grid-line-strong: rgba(255,255,255,0.14);
    --paper: #EFE9DA;
    --paper-2: #E4DCC6;
    --ink: #17293A;
    --ink-soft: #4A5C6E;
    --white: #F4F6F8;
    --white-dim: #B9C6D2;
    --amber: #E3A53D;
    --amber-deep: #C77F1E;
    --cyan: #5FB3D9;
    --known: #6FAE7A;
    --retry: #D97A5C;
    --radius-card: 14px;
    --radius-sm: 8px;
    --font-jp: 'Zen Kaku Gothic New', sans-serif;
    --font-mono: 'IBM Plex Mono', monospace;
  }
  :root:not([data-theme="light"]) {
    color-scheme: dark;
  }
  @media (prefers-color-scheme: light) {
    :root:not([data-theme="dark"]) {
      --bg: #E7EEF3;
      --bg-panel: #F4F1E6;
      --bg-panel-2: #FFFFFF;
      --grid-line: rgba(14,42,67,0.08);
      --grid-line-strong: rgba(14,42,67,0.16);
      --paper: #FFFFFF;
      --paper-2: #F1ECDB;
      --ink: #17293A;
      --ink-soft: #4A5C6E;
      --white: #0E2A43;
      --white-dim: #3E5468;
    }
  }
  :root[data-theme="light"] {
    --bg: #E7EEF3;
    --bg-panel: #F4F1E6;
    --bg-panel-2: #FFFFFF;
    --grid-line: rgba(14,42,67,0.08);
    --grid-line-strong: rgba(14,42,67,0.16);
    --paper: #FFFFFF;
    --paper-2: #F1ECDB;
    --ink: #17293A;
    --ink-soft: #4A5C6E;
    --white: #0E2A43;
    --white-dim: #3E5468;
  }

  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--white);
    font-family: var(--font-jp);
    -webkit-font-smoothing: antialiased;
  }
  body {
    background-image:
      linear-gradient(var(--grid-line) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line) 1px, transparent 1px),
      linear-gradient(var(--grid-line-strong) 1px, transparent 1px),
      linear-gradient(90deg, var(--grid-line-strong) 1px, transparent 1px);
    background-size: 16px 16px, 16px 16px, 80px 80px, 80px 80px;
    min-height: 100vh;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 28px 18px 60px; }

  header.top { margin-bottom: 18px; }
  .eyebrow {
    font-family: var(--font-mono);
    font-size: 12px;
    letter-spacing: 0.04em;
    color: var(--cyan);
    margin: 0 0 6px;
  }
  h1 {
    font-size: 28px;
    font-weight: 900;
    margin: 0 0 4px;
    letter-spacing: -0.01em;
  }
  nav.tabs {
    display: flex; gap: 4px; margin-bottom: 20px;
    border-bottom: 1px solid var(--grid-line-strong);
  }
  nav.tabs button {
    font-family: var(--font-jp);
    font-size: 14px; font-weight: 500;
    background: none; border: none;
    color: var(--white-dim);
    padding: 10px 14px;
    cursor: pointer;
    border-bottom: 2px solid transparent;
    margin-bottom: -1px;
  }
  nav.tabs button.active {
    color: var(--white);
    border-bottom: 2px solid var(--amber);
  }
  nav.tabs button:focus-visible, button:focus-visible, select:focus-visible, input:focus-visible {
    outline: 2px solid var(--cyan); outline-offset: 2px;
  }

  .panel { display: none; }
  .panel.active { display: block; }

  /* --- overview stats --- */
  .statoverall {
    background: var(--bg-panel);
    border: 1px solid var(--grid-line-strong);
    border-radius: var(--radius-card);
    padding: 16px 18px;
    margin-bottom: 12px;
  }
  .statoverall .stitle { font-family: var(--font-mono); font-size: 12px; color: var(--white-dim); margin: 0 0 12px; }
  .statnums { display: flex; gap: 22px; flex-wrap: wrap; margin-bottom: 12px; }
  .statnum b { display: block; font-size: 22px; font-family: var(--font-mono); line-height: 1.1; }
  .statnum span { font-size: 11.5px; color: var(--white-dim); }
  .statnum.known b { color: var(--known); }
  .statnum.retry b { color: var(--retry); }
  .statcatlist { display: flex; flex-direction: column; gap: 7px; }
  .statcat-row { display: flex; align-items: center; gap: 10px; }
  .statcat-name { font-size: 12.5px; width: 168px; flex-shrink: 0; color: var(--white-dim); line-height: 1.3; }
  .statcat-track { flex: 1; height: 8px; background: var(--bg-panel-2); border-radius: 4px; overflow: hidden; border: 1px solid var(--grid-line-strong); }
  .statcat-fill { height: 100%; background: var(--known); border-radius: 4px; }
  .statcat-pct { font-family: var(--font-mono); font-size: 11.5px; width: 46px; text-align: right; color: var(--white-dim); }

  /* --- add card form --- */
  .addform { display: flex; flex-direction: column; gap: 6px; margin-bottom: 24px; }
  .addlabel { font-size: 12.5px; color: var(--white-dim); margin-top: 8px; }
  .addlabel .req { color: var(--retry); }
  textarea {
    font-family: var(--font-jp);
    font-size: 13.5px;
    background: var(--bg-panel-2);
    border: 1px solid var(--grid-line-strong);
    color: var(--white);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
    resize: vertical;
  }
  .addcheck { font-size: 13px; color: var(--white-dim); display: flex; align-items: center; gap: 6px; margin-top: 6px; }
  .addsubmit {
    margin-top: 12px;
    font-family: var(--font-jp); font-size: 14px; font-weight: 600;
    background: var(--amber); color: #1D1305;
    border: none; border-radius: var(--radius-sm);
    padding: 12px; cursor: pointer;
  }
  .addlisthead { font-family: var(--font-mono); font-size: 12px; color: var(--white-dim); margin-bottom: 8px; }

  /* --- 4-choice quiz --- */
  .qzcard { background: var(--paper); color: var(--ink); border-radius: var(--radius-card); padding: 20px 18px; border: 1px solid rgba(0,0,0,0.08); box-shadow: 0 8px 24px rgba(0,0,0,0.22), inset 0 0 0 1px rgba(255,255,255,0.4); margin-bottom: 14px; }
  .qzmeta { font-family: var(--font-mono); font-size: 10.5px; color: var(--ink-soft); background: rgba(23,41,58,0.08); padding: 4px 8px; border-radius: 5px; display: inline-block; margin-bottom: 12px; }
  .qzprompt { font-size: 14.5px; line-height: 1.85; color: var(--ink); margin: 0 0 16px; }
  .qzresultbanner { padding: 11px 14px; border-radius: 10px; margin-bottom: 14px; font-weight: 700; font-size: 14px; }
  .qzresultbanner.correct { background: rgba(111,174,122,0.85); color: #0D2113; }
  .qzresultbanner.incorrect { background: rgba(217,122,92,0.85); color: #2B1006; }
  .qzoptlist { display: flex; flex-direction: column; gap: 10px; }
  .qzoption { display: flex; gap: 10px; align-items: center; text-align: left; width: 100%; background: rgba(23,41,58,0.04); border: 1px solid rgba(23,41,58,0.16); border-radius: 10px; padding: 12px 14px; font-family: var(--font-mono); font-size: 13.5px; font-weight: 600; color: var(--ink); cursor: pointer; }
  .qzoption .qzletter { font-family: var(--font-mono); font-weight: 700; flex-shrink: 0; width: 22px; height: 22px; border-radius: 50%; background: rgba(23,41,58,0.09); display: flex; align-items: center; justify-content: center; font-size: 12px; }
  .qzoption.selected { border-color: var(--cyan); background: rgba(95,179,217,0.14); }
  .qzoption.correct { border-color: var(--known); background: rgba(111,174,122,0.18); }
  .qzoption.incorrect { border-color: var(--retry); background: rgba(217,122,92,0.18); }
  .qzcaret { margin-left: auto; flex-shrink: 0; font-size: 11px; color: var(--ink-soft); }
  .qzexplain { margin: -4px 0 4px; padding: 8px 10px; font-size: 12px; line-height: 1.65; border-radius: 0 8px 8px 0; border-left: 3px solid var(--ink-soft); background: rgba(23,41,58,0.05); color: var(--ink-soft); }
  .qzexplain.correct { border-left-color: var(--known); color: var(--ink); }
  .qzexplain.incorrect { border-left-color: var(--retry); color: var(--ink); }
  .delbtn {
    background: none; border: 1px solid var(--grid-line-strong); color: var(--retry);
    font-family: var(--font-mono); font-size: 11px; padding: 6px 10px; border-radius: 6px; cursor: pointer;
    flex-shrink: 0;
  }

  /* --- controls --- */
  .controls {
    display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 16px; align-items: center;
  }
  select, input[type="text"] {
    font-family: var(--font-jp);
    font-size: 13.5px;
    background: var(--bg-panel-2);
    border: 1px solid var(--grid-line-strong);
    color: var(--white);
    border-radius: var(--radius-sm);
    padding: 8px 10px;
  }
  select { flex: 1; min-width: 140px; }
  input[type="text"] { flex: 1.4; min-width: 160px; }
  .chip {
    font-family: var(--font-mono);
    font-size: 12px;
    background: var(--bg-panel-2);
    border: 1px solid var(--grid-line-strong);
    color: var(--white-dim);
    border-radius: 999px;
    padding: 7px 13px;
    cursor: pointer;
    white-space: nowrap;
  }
  .chip.on { background: var(--amber); color: #1D1305; border-color: var(--amber); font-weight: 600; }

  .cardcount { text-align: center; font-family: var(--font-mono); font-size: 12px; color: var(--white-dim); margin-bottom: 10px; }

  /* --- flashcard --- */
  .stage { perspective: 1400px; margin-bottom: 16px; }
  .card {
    position: relative;
    width: 100%;
    min-height: 300px;
    transform-style: preserve-3d;
    transition: transform 0.5s cubic-bezier(.2,.8,.2,1);
    cursor: pointer;
  }
  .card.flipped { transform: rotateY(180deg); }
  .face {
    position: absolute; inset: 0;
    backface-visibility: hidden;
    border-radius: var(--radius-card);
    padding: 26px 24px;
    display: flex; flex-direction: column;
    background: var(--paper);
    color: var(--ink);
    border: 1px solid rgba(0,0,0,0.08);
    box-shadow: 0 8px 24px rgba(0,0,0,0.28), inset 0 0 0 1px rgba(255,255,255,0.4);
    overflow-y: auto;
    -webkit-overflow-scrolling: touch;
  }
  .face.back { transform: rotateY(180deg); background: var(--paper-2); justify-content: flex-start; }
  .facetop { display: flex; justify-content: space-between; align-items: flex-start; margin-bottom: auto; }
  .catlabel {
    font-family: var(--font-mono); font-size: 10.5px; letter-spacing: 0.03em;
    color: var(--ink-soft);
    background: rgba(23,41,58,0.08);
    padding: 4px 8px; border-radius: 5px;
  }
  .weakbadge {
    font-family: var(--font-mono); font-size: 10.5px;
    color: #8A3C1E; background: rgba(211,122,74,0.18);
    padding: 4px 8px; border-radius: 5px;
  }
  .termname {
    font-family: var(--font-mono);
    font-weight: 700;
    font-size: clamp(20px, 5vw, 27px);
    line-height: 1.3;
    margin: auto 0;
    color: var(--ink);
    word-break: break-word;
  }
  .fliphint { text-align: center; font-size: 11.5px; color: var(--ink-soft); margin-top: auto; font-family: var(--font-mono); }
  .desc { font-size: 15px; line-height: 1.85; color: var(--ink); margin: 4px 0 0; }
  .backterm { font-family: var(--font-mono); font-size: 13px; color: var(--ink-soft); margin-bottom: 10px; font-weight: 600; }

  .tipbadge { font-size: 13px; }

  .tipsheader { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 11px; letter-spacing: 0.02em; color: var(--amber-deep); margin: 16px 0 8px; padding-top: 14px; border-top: 1px dashed rgba(23,41,58,0.18); }
  .tipaddtoggle { flex-shrink: 0; background: none; border: 1px solid rgba(199,127,30,0.45); color: var(--amber-deep); font-family: var(--font-mono); font-size: 11px; padding: 4px 10px; border-radius: 999px; cursor: pointer; }
  .tiplist { display: flex; flex-direction: column; gap: 8px; }
  .tipitem { display: flex; gap: 8px; align-items: flex-start; background: rgba(227,165,61,0.16); border-left: 3px solid var(--amber); border-radius: 0 8px 8px 0; padding: 9px 10px; }
  .tiptext { flex: 1; font-size: 12.5px; line-height: 1.65; color: var(--ink); white-space: pre-wrap; }
  .tipdel { flex-shrink: 0; background: none; border: none; color: var(--ink-soft); font-size: 16px; line-height: 1; cursor: pointer; padding: 0 3px; }
  .tipempty { font-size: 12px; color: var(--ink-soft); }
  .tipcomposer { margin-top: 8px; display: flex; flex-direction: column; gap: 6px; }
  .tipcomposer textarea { font-family: var(--font-jp); font-size: 12.5px; padding: 8px 10px; border-radius: 8px; border: 1px solid rgba(23,41,58,0.22); background: rgba(255,255,255,0.55); color: var(--ink); resize: vertical; }
  .tipcomposerbtns { display: flex; gap: 8px; }
  .tipcomposerbtns button { flex: 1; font-family: var(--font-jp); font-size: 12.5px; padding: 8px; border-radius: 8px; cursor: pointer; border: 1px solid rgba(23,41,58,0.22); background: rgba(255,255,255,0.55); color: var(--ink); }
  .tipcomposerbtns button.save { background: var(--amber); border-color: var(--amber); color: #1D1305; font-weight: 600; }

  .cardnav { display: flex; gap: 8px; margin-bottom: 12px; }
  .navbtn {
    flex: 1;
    font-family: var(--font-jp); font-size: 14px; font-weight: 500;
    background: var(--bg-panel-2);
    border: 1px solid var(--grid-line-strong);
    color: var(--white);
    border-radius: var(--radius-sm);
    padding: 12px;
    cursor: pointer;
  }
  .navbtn:active { transform: translateY(1px); }
  .navbtn.wide { flex: 1.6; }

  .marks { display: flex; gap: 8px; margin-bottom: 8px; }
  .markbtn {
    flex: 1;
    font-family: var(--font-jp); font-size: 13.5px; font-weight: 600;
    border-radius: var(--radius-sm);
    padding: 12px;
    cursor: pointer;
    border: 1px solid var(--grid-line-strong);
    background: var(--bg-panel-2);
    color: var(--white-dim);
  }
  .markbtn.known.active { background: var(--known); border-color: var(--known); color: #0D2113; }
  .markbtn.retry.active { background: var(--retry); border-color: var(--retry); color: #2B1006; }

  .toolrow { display: flex; justify-content: space-between; align-items: center; margin-top: 18px; }
  .textbtn {
    background: none; border: none; color: var(--white-dim);
    font-family: var(--font-mono); font-size: 12px;
    cursor: pointer; text-decoration: underline; text-underline-offset: 3px;
    padding: 4px;
  }

  /* --- review list --- */
  .reviewlist { display: flex; flex-direction: column; gap: 8px; }
  .reviewitem {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--bg-panel);
    border: 1px solid var(--grid-line-strong);
    border-radius: var(--radius-sm);
    padding: 12px 14px;
    cursor: pointer;
  }
  .reviewitem .rterm { font-family: var(--font-mono); font-size: 14px; font-weight: 600; }
  .reviewitem .rcat { font-size: 11.5px; color: var(--white-dim); margin-top: 2px; }
  .reviewitem .rarrow { color: var(--amber); font-family: var(--font-mono); }
  .emptynote { color: var(--white-dim); font-size: 13.5px; text-align: center; padding: 40px 10px; line-height: 1.8; }

  /* --- term list view --- */
  .termlist { display: flex; flex-direction: column; gap: 10px; }
  .termlistitem { background: var(--bg-panel); border: 1px solid var(--grid-line-strong); border-radius: var(--radius-sm); padding: 14px 16px; }
  .tlihead { display: flex; justify-content: space-between; align-items: flex-start; gap: 8px; margin-bottom: 8px; flex-wrap: wrap; }
  .tliterm { font-family: var(--font-mono); font-weight: 700; font-size: 14.5px; color: var(--white); }
  .tlibadges { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
  .tlicat { font-family: var(--font-mono); font-size: 10.5px; color: var(--white-dim); background: rgba(255,255,255,0.08); padding: 3px 7px; border-radius: 5px; }
  .tliweak { font-family: var(--font-mono); font-size: 10.5px; color: #F0B98A; background: rgba(217,122,92,0.22); padding: 3px 7px; border-radius: 5px; }
  .tlitipbadge { font-size: 12px; }
  .tlidesc { font-size: 13px; line-height: 1.75; color: var(--white-dim); margin: 0 0 10px; }
  .tlitips { display: flex; flex-direction: column; gap: 6px; margin-bottom: 10px; }
  .tlitip { background: rgba(227,165,61,0.14); border-left: 3px solid var(--amber); border-radius: 0 6px 6px 0; padding: 7px 9px; font-size: 12px; line-height: 1.6; color: var(--white); }
  .tlimarks { display: flex; gap: 8px; }
  .tlimarkbtn { flex: 1; font-family: var(--font-jp); font-size: 12px; font-weight: 600; border-radius: 6px; padding: 8px; cursor: pointer; border: 1px solid var(--grid-line-strong); background: var(--bg-panel-2); color: var(--white-dim); }
  .tlimarkbtn.known.active { background: var(--known); border-color: var(--known); color: #0D2113; }
  .tlimarkbtn.retry.active { background: var(--retry); border-color: var(--retry); color: #2B1006; }

  footer.foot { text-align: center; margin-top: 30px; }
  footer.foot button {
    background: none; border: 1px solid var(--grid-line-strong); color: var(--white-dim);
    font-family: var(--font-mono); font-size: 11.5px; padding: 8px 14px; border-radius: 999px; cursor: pointer;
  }

  @media (max-width: 420px) {
    h1 { font-size: 23px; }
  }
</style>
</head>
<body>
<div class="wrap">

  <header class="top">
    <p class="eyebrow">AWS Certified Solutions Architect – Professional / SAP-C02</p>
    <h1>AWS SAP 単語帳</h1>
  </header>

  <nav class="tabs">
    <button class="tab-btn active" data-tab="cards">単語カード</button>
    <button class="tab-btn" data-tab="review">苦手リスト</button>
    <button class="tab-btn" data-tab="add">カード追加</button>
    <button class="tab-btn" data-tab="quiz">4択クイズ</button>
  </nav>

  <!-- CARDS -->
  <section class="panel active" id="panel-cards">
    <div class="controls">
      <select id="categorySelect"></select>
      <input type="text" id="searchInput" placeholder="用語や説明で検索…">
    </div>
    <div class="controls">
      <span class="chip" id="weakChip">苦手のみ</span>
      <span class="chip" id="shuffleChip">シャッフル</span>
    </div>
    <div class="controls">
      <span class="chip viewchip on" id="viewCardChip">🗂 カード表示</span>
      <span class="chip viewchip" id="viewListChip">📋 一覧表示</span>
    </div>

    <div class="cardcount" id="cardIndexLabel"></div>

    <div id="cardViewWrap">
      <div class="stage">
        <div class="card" id="flashcard">
          <div class="face front">
            <div class="facetop">
              <span class="catlabel" id="frontCat">—</span>
              <span>
                <span class="tipbadge" id="frontTipBadge" style="display:none;">🎯</span>
                <span class="weakbadge" id="frontWeak" style="display:none;">苦手</span>
              </span>
            </div>
            <div class="termname" id="frontTerm">—</div>
            <div class="fliphint">タップして意味を見る ↻</div>
          </div>
          <div class="face back">
            <div class="backterm" id="backTerm">—</div>
            <p class="desc" id="backDesc">—</p>
            <div id="backTips"></div>
          </div>
        </div>
      </div>

      <div class="marks">
        <button class="markbtn retry" id="markRetry">↺ 苦手</button>
        <button class="markbtn known" id="markKnown">✓ 覚えた</button>
      </div>

      <div class="cardnav">
        <button class="navbtn" id="prevBtn">← 前へ</button>
        <button class="navbtn wide" id="flipBtn">裏返す</button>
        <button class="navbtn" id="nextBtn">次へ →</button>
      </div>
    </div>

    <div id="listViewWrap" style="display:none;">
      <div class="termlist" id="termListArea"></div>
    </div>

    <div class="toolrow">
      <button class="textbtn" id="resetFilterBtn">絞り込みを解除</button>
      <span style="font-family:var(--font-mono); font-size:11px; color:var(--white-dim);" id="totalTermsLabel"></span>
    </div>
  </section>

  <!-- REVIEW -->
  <section class="panel" id="panel-review">
    <div class="reviewlist" id="reviewList"></div>
  </section>

  <!-- ADD -->
  <section class="panel" id="panel-add">
    <form class="addform" id="addForm">
      <label class="addlabel" for="addTermInput">用語 <span class="req">*</span></label>
      <input type="text" id="addTermInput" placeholder="例: Amazon Verified Permissions" autocomplete="off" required>

      <label class="addlabel" for="addCatSelect">カテゴリ</label>
      <select id="addCatSelect"></select>
      <input type="text" id="addCatNewInput" placeholder="新しいカテゴリ名を入力" autocomplete="off" style="display:none; margin-top:6px;">

      <label class="addlabel" for="addDescInput">説明 <span class="req">*</span></label>

  var TOTAL = TERMS.length;

  var customTerms = [];

  // ---- exam tips (per-term notes the user adds) ----
  var examTips = {};

    var rawTips = localStorage.getItem("awsSapExamTips");
    if (rawTips) examTips = JSON.parse(rawTips);
  } catch(e) { examTips = {}; }

    try { localStorage.setItem("awsSapExamTips", JSON.stringify(examTips)); } catch(e){}
  }
  function getTipsFor(id){ return examTips[id] || []; }
  function addTip(id, text){
    text = (text || "").trim();
    if (!text) return;
    if (!examTips[id]) examTips[id] = [];
    examTips[id].push(text);
    saveExamTips();
  }
  function deleteTip(id, idx){
    if (!examTips[id]) return;
    examTips[id].splice(idx, 1);
    if (examTips[id].length === 0) delete examTips[id];
    saveExamTips();
  }
  function totalTipCount(){
    var n = 0;
    Object.keys(examTips).forEach(function(id){ n += examTips[id].length; });
    return n;
  }

  var flipped = false;

  // ---- 4-choice quiz state ----
  var qzFilterCat = "all";
  var qzWeakOnly = false;
  var qzPool = [];
  var qzOrder = [];
  var qzOrderPos = 0;
  var qzCurrent = null;
  var qzSessionCorrect = 0;
  var qzSessionTotal = 0;
  var qzModeCount = 0;
  var qzRoundDone = false;

  // ---- dynamic categories (created through the add-card form) ----
  var dynamicCats = [];
  function registerCategory(key){
    if (CATMAP[key]) return key;
    CATMAP[key] = key;
    dynamicCats.push([key, key]);
    return key;
  }
  customTerms.forEach(function(ct){ registerCategory(ct.cat); });

  function resolveCategoryKey(inputText){
    var txt = (inputText || "").trim();
    if (!txt) txt = "マイ単語";
    var found = null;
    CATS.forEach(function(c){ if (c[1] === txt || c[0] === txt) found = c[0]; });
    if (found) return found;
    dynamicCats.forEach(function(c){ if (c[1] === txt) found = c[0]; });
    if (found) return found;
    return registerCategory(txt);
  }

  // ---- build/rebuild category choosers (filter select + add-form select + quiz select) ----
  var catSelect = document.getElementById("categorySelect");
  var addCatSelect = document.getElementById("addCatSelect");
  var addCatNewInput = document.getElementById("addCatNewInput");
  var qzCategorySelect = document.getElementById("qzCategorySelect");

  function rebuildCategoryChoosers(){
    var keep = catSelect.value || "all";
    catSelect.innerHTML = "";
    var optAll = document.createElement("option");
    optAll.value = "all"; optAll.textContent = "すべてのカテゴリ";
    catSelect.appendChild(optAll);

      opt.value = c[0]; opt.textContent = c[1];
      catSelect.appendChild(opt);
    });
    var stillThere = Array.prototype.some.call(catSelect.options, function(o){ return o.value === keep; });
    catSelect.value = stillThere ? keep : "all";
    filterCat = catSelect.value;

  // ---- 4-choice quiz ----
  function shuffleArrQz(arr){
    var a = arr.slice();
    for (var i = a.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = a[i]; a[i] = a[j]; a[j] = tmp;
    }
    return a;
  }

  function getQzPool(){
    return getAllTerms().filter(function(x){
      if (qzFilterCat !== "all" && x.cat !== qzFilterCat) return false;
      if (qzWeakOnly && progress[x.id] !== "retry") return false;
      return true;
    });
  }

  // Distractors are drawn from the whole term set (not the filtered pool), preferring the
  // same category as the correct answer so the 4 choices are as functionally similar as possible.
  function pickDistractors(correctItem, count){
    var all = getAllTerms();
    var sameCat = shuffleArrQz(all.filter(function(x){ return x.id !== correctItem.id && x.cat === correctItem.cat; }));
    var otherCat = shuffleArrQz(all.filter(function(x){ return x.id !== correctItem.id && x.cat !== correctItem.cat; }));
    var chosen = sameCat.slice(0, count);
    if (chosen.length < count) chosen = chosen.concat(otherCat.slice(0, count - chosen.length));
    return chosen;
  }

  function buildQuizQuestion(correctItem){
    var distractors = pickDistractors(correctItem, 3);
    var options = shuffleArrQz([correctItem].concat(distractors));
    var correctIdx = -1;
    for (var i = 0; i < options.length; i++) { if (options[i].id === correctItem.id) { correctIdx = i; break; } }
    return { correctItem: correctItem, options: options, correctIdx: correctIdx, answered: false, selectedIdx: null, expanded: {} };
  }

  function nextQuizQuestion(){
    if (qzModeCount > 0 && qzSessionTotal >= qzModeCount) {
      qzRoundDone = true;
      qzCurrent = null;
      renderQuiz();
      return;
    }
    qzRoundDone = false;
    qzPool = getQzPool();
    if (qzPool.length === 0) { qzCurrent = null; renderQuiz(); return; }
    if (!qzOrder.length || qzOrderPos >= qzOrder.length) {
      qzOrder = shuffleArrQz(qzPool.map(function(x){ return x.id; }));
      qzOrderPos = 0;
    }
    var id = qzOrder[qzOrderPos];
    qzOrderPos++;
    var item = null;
    for (var i = 0; i < qzPool.length; i++) { if (qzPool[i].id === id) { item = qzPool[i]; break; } }
    if (!item) { nextQuizQuestion(); return; }
    qzCurrent = buildQuizQuestion(item);
    renderQuiz();
  }

  function resetQuizSession(){
    qzOrder = [];
    qzOrderPos = 0;
    qzSessionCorrect = 0;
    qzSessionTotal = 0;
    qzRoundDone = false;
    nextQuizQuestion();
  }

  var QZ_LETTERS = ["A", "B", "C", "D"];

  function renderQuiz(){
    var poolSize = getQzPool().length;
    var area = document.getElementById("qzArea");

    if (qzModeCount > 0) {
      var curNum = Math.min(qzSessionTotal + ((qzCurrent && !qzCurrent.answered) ? 1 : 0), qzModeCount);
      document.getElementById("qzStatusLabel").textContent =
        "問題 " + curNum + " / " + qzModeCount + (qzSessionTotal > 0 ? " ・ " + qzSessionCorrect + "問正解" : "");
    } else {
      document.getElementById("qzStatusLabel").textContent =
        "出題プール " + poolSize + "語" + (qzSessionTotal > 0 ? " ・ セッション " + qzSessionCorrect + "/" + qzSessionTotal + " 正解" : "");
    }

    if (qzRoundDone) { renderQuizResults(area); return; }

    if (!qzCurrent) {
      area.innerHTML = '<div class="emptynote">条件に合う単語がありません。絞り込みを変えてみてください。</div>';
      return;
    }

    var qz = qzCurrent;
    var html = '<div class="qzcard">';
    if (qz.answered) {
      html += '<span class="qzmeta">' + escapeHtml(CATMAP[qz.correctItem.cat] || qz.correctItem.cat) + '</span>';
    }
    html += '<p class="qzprompt">' + escapeHtml(qz.correctItem.desc) + '</p>';
    if (qz.answered) {
      var ok = (qz.selectedIdx === qz.correctIdx);
      html += '<div class="qzresultbanner ' + (ok ? "correct" : "incorrect") + '">' + (ok ? "正解です" : "不正解です") + '</div>';
    }
    html += '<div class="qzoptlist">';
    qz.options.forEach(function(opt, i){
      var cls = "qzoption";
      if (qz.answered) {
        cls += " locked";
        if (i === qz.correctIdx) cls += " correct";
        else if (i === qz.selectedIdx) cls += " incorrect";
      } else if (i === qz.selectedIdx) {
        cls += " selected";
      }
      html += '<button type="button" class="' + cls + '" data-i="' + i + '"><span class="qzletter">' + QZ_LETTERS[i] + '</span><span>' + escapeHtml(opt.term) + '</span>';
      if (qz.answered) html += '<span class="qzcaret">' + (qz.expanded[i] ? "▾" : "▸") + '</span>';
      html += '</button>';
      if (qz.answered && qz.expanded[i]) {
        var eCls = (i === qz.correctIdx) ? "correct" : (i === qz.selectedIdx ? "incorrect" : "");
        var optTips = getTipsFor(opt.id);
        html += '<div class="qzexplain ' + eCls + '"><p style="margin:0;">' + escapeHtml(opt.desc) + '</p>';
        if (optTips.length) {
          html += '<div class="tiplist" style="margin-top:8px;">';
          optTips.forEach(function(tp){
            html += '<div class="tipitem"><span class="tiptext">' + escapeHtml(tp) + '</span></div>';
          });
          html += '</div>';
        }
        html += '</div>';
      }
    });
    html += '</div></div>';

    if (qz.answered) {
      var isLast = (qzModeCount > 0 && qzSessionTotal >= qzModeCount);
      html += '<div class="cardnav"><button type="button" class="navbtn primary" id="qzNextBtn">' + (isLast ? "結果を見る →" : "次の問題へ →") + '</button></div>';
    }

    area.innerHTML = html;

    if (!qz.answered) {
      area.querySelectorAll(".qzoption").forEach(function(b){
        b.addEventListener("click", function(){
          var i = parseInt(this.getAttribute("data-i"), 10);
          qz.answered = true;
          qz.selectedIdx = i;
          var correct = (i === qz.correctIdx);
          qzSessionTotal++;
          if (correct) qzSessionCorrect++;
          progress[qz.correctItem.id] = correct ? "known" : "retry";
          saveProgress();
          renderQuiz();
        });
      });
    } else {
      area.querySelectorAll(".qzoption").forEach(function(b){
        b.addEventListener("click", function(){
          var i = parseInt(this.getAttribute("data-i"), 10);
          qz.expanded[i] = !qz.expanded[i];
          renderQuiz();
        });

      if (nextBtn) nextBtn.addEventListener("click", function(){ nextQuizQuestion(); });

  function getFiltered(){
    var all = getAllTerms();
    return order
      .map(function(id){ return all.filter(function(x){ return x.id === id; })[0]; })
      .filter(function(x){
        if (!x) return false;
        if (filterCat !== "all" && x.cat !== filterCat) return false;
        if (filterWeakOnly && progress[x.id] !== "retry") return false;
        if (searchText) {
          var hay = (x.term + " " + x.desc).toLowerCase();
          if (hay.indexOf(searchText.toLowerCase()) === -1) return false;
        }
        return true;
      });
  }

  function shuffleOrder(){
    var arr = getAllTerms().map(function(x){ return x.id; });
    for (var i = arr.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var tmp = arr[i]; arr[i] = arr[j]; arr[j] = tmp;
    }
    order = arr;
  }

  function deleteCustomTerm(id){
    if (!confirm("このカードを削除します。よろしいですか？")) return;
    customTerms = customTerms.filter(function(x){ return x.id !== id; });
    saveCustomTerms();
    order = order.filter(function(x){ return x !== id; });

  function resetAddForm(){
    editingId = null;
    addForm.reset();
    addCatSelect.value = "custom";
    addCatNewInput.style.display = "none";

  function startEdit(item){
    editingId = item.id;
    document.getElementById("addTermInput").value = item.term;
    document.getElementById("addDescInput").value = item.desc;
    document.getElementById("addWeakInput").checked = (progress[item.id] === "retry");
    var hasOption = Array.prototype.some.call(addCatSelect.options, function(o){ return o.value === item.cat; });
    addCatSelect.value = hasOption ? item.cat : "custom";
    addCatNewInput.style.display = "none";
    addSubmitBtn.textContent = "更新する";

    addForm.scrollIntoView({ behavior: "smooth", block: "start" });

  addForm.addEventListener("submit", function(e){
    e.preventDefault();
    var termVal = document.getElementById("addTermInput").value.trim();
    var descVal = document.getElementById("addDescInput").value.trim();
    var weakVal = document.getElementById("addWeakInput").checked;
    if (!termVal || !descVal) return;

    var catKey;
    if (addCatSelect.value === "__new__") {
      catKey = resolveCategoryKey(addCatNewInput.value);
      rebuildCategoryChoosers();
    } else {
      catKey = addCatSelect.value;
    }

    var finalId;
    if (editingId) {
      finalId = editingId;
      var idx = -1;
      for (var i = 0; i < customTerms.length; i++) { if (customTerms[i].id === editingId) { idx = i; break; } }
      if (idx >= 0) customTerms[idx] = t(editingId, termVal, catKey, descVal, false);
      saveCustomTerms();
    } else {
      finalId = "u" + Date.now().toString(36) + Math.floor(Math.random() * 1000);
      customTerms.push(t(finalId, termVal, catKey, descVal, false));
      saveCustomTerms();
      order.push(finalId);
    }

    if (weakVal) {
      progress[finalId] = "retry";
    } else if (progress[finalId] === "retry") {
      delete progress[finalId];
    }
    saveProgress();

    resetAddForm();
    renderAddList();
    renderCard();
  });

  // ---- backup: export / import ----
  async function getDownloadsCap(){
    try {
      if (!window.claude || typeof window.claude.use !== "function") return null;
      var cap = await window.claude.use("downloads");
      return cap || null;
    } catch(e) { return null; }
  }

  function showExportFallback(payload){
    var ta = document.getElementById("exportFallback");
    var note = document.getElementById("exportFallbackNote");
    ta.value = payload;
    ta.style.display = "block";
    note.style.display = "block";
    ta.focus();
    ta.select();
  }

  function hideExportFallback(){
    document.getElementById("exportFallback").style.display = "none";
    document.getElementById("exportFallbackNote").style.display = "none";
  }

  document.getElementById("exportBtn").addEventListener("click", async function(){
    var ta = document.getElementById("exportFallback");
    if (ta.style.display === "block") { hideExportFallback(); return; }

    var payload = JSON.stringify({
      version: 1,
      exportedAt: new Date().toISOString(),
      customTerms: customTerms,
      progress: progress,
      examTips: examTips
    }, null, 2);

    var downloads = await getDownloadsCap();
    if (!downloads) { showExportFallback(payload); return; }
    try {
      await downloads.save({ filename: "aws-sap-flashcards-backup.json", data: payload });
    } catch(err) {
      if (!err || err.code !== "declined") showExportFallback(payload);
    }
  });

  document.getElementById("importBtn").addEventListener("click", function(){
    document.getElementById("importFileInput").click();
  });

  document.getElementById("importFileInput").addEventListener("change", function(e){
    var file = e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){
      var added = 0;
      try {
        var data = JSON.parse(reader.result);
        var importedCustom = Array.isArray(data.customTerms) ? data.customTerms : [];
        var importedProgress = (data.progress && typeof data.progress === "object") ? data.progress : {};
        var importedTips = (data.examTips && typeof data.examTips === "object") ? data.examTips : {};

        var existingIds = {};
        customTerms.forEach(function(x){ existingIds[x.id] = true; });
        var idRemap = {};

        importedCustom.forEach(function(item){
          if (!item || !item.term || !item.desc) return;
          var originalId = item.id;
          var id = item.id;
          if (!id || existingIds[id]) {
            id = "u" + Date.now().toString(36) + Math.floor(Math.random() * 100000);
          }
          existingIds[id] = true;
          if (originalId) idRemap[originalId] = id;
          var cat = item.cat || "custom";
          registerCategory(cat);
          customTerms.push(t(id, item.term, cat, item.desc, !!item.weak));
          added++;
        });

        Object.keys(importedProgress).forEach(function(k){ progress[k] = importedProgress[k]; });

        Object.keys(importedTips).forEach(function(oldId){
          var newId = idRemap.hasOwnProperty(oldId) ? idRemap[oldId] : oldId;
          var arr = examTips[newId] || [];
          importedTips[oldId].forEach(function(txt){
            if (arr.indexOf(txt) === -1) arr.push(txt);
          });
          if (arr.length) examTips[newId] = arr;
        });

        saveCustomTerms();
        saveProgress();
        saveExamTips();
        order = getAllTerms().map(function(x){ return x.id; });
        if (shuffled) shuffleOrder();
        rebuildCategoryChoosers();
        renderAddList();
        renderCard();
        renderReview();
        alert(added + "件のカードを読み込みました。");
      } catch(err) {
        alert("読み込みに失敗しました。ファイルの内容を確認してください。");
      }
      document.getElementById("importFileInput").value = "";
    };
    reader.readAsText(file);
  });

  // ---- review list ----
  function renderReview(){
    var listEl = document.getElementById("reviewList");
    listEl.innerHTML = "";
    var retryTerms = getAllTerms().filter(function(x){ return progress[x.id] === "retry"; });
    if (retryTerms.length === 0){
      var empty = document.createElement("div");

      empty.textContent = "「苦手」に印をつけたカードがここに並びます。単語カードタブでカードを裏返し、↺ 苦手 ボタンを押してみてください。";
      listEl.appendChild(empty);
      return;
    }
    retryTerms.forEach(function(item){
      var row = document.createElement("div");
      row.className = "reviewitem";
      row.innerHTML =
        '<div><div class="rterm">' + item.term + '</div><div class="rcat">' + CATMAP[item.cat] + '</div></div>' +
        '<span class="rarrow">開く →</span>';
      row.addEventListener("click", function(){
        switchTab("cards");
        filterCat = "all"; catSelect.value = "all";
        filterWeakOnly = false; document.getElementById("weakChip").classList.remove("on");
        searchText = ""; document.getElementById("searchInput").value = "";
        var list = getFiltered();
        var idx = list.findIndex(function(x){ return x.id === item.id; });
        currentPos = idx >= 0 ? idx : 0;
        renderCard();
      });
      listEl.appendChild(row);
    });
  }

  // ---- tabs ----
  function switchTab(name){
    document.querySelectorAll(".tab-btn").forEach(function(b){
      b.classList.toggle("active", b.getAttribute("data-tab") === name);
    });
    document.querySelectorAll(".panel").forEach(function(p){
      p.classList.toggle("active", p.id === "panel-" + name);
    });
    if (name === "review") renderReview();
    if (name === "add") renderAddList();
    if (name === "quiz") renderQuiz();
  }
  document.querySelectorAll(".tab-btn").forEach(function(b){
    b.addEventListener("click", function(){ switchTab(b.getAttribute("data-tab")); });
  });

  // ---- init ----
  renderCard();
  renderReview();
  renderAddList();
  resetQuizSession();
})();
</script>
</body>
</html>
